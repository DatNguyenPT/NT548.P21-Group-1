AWSTemplateFormatVersion: '2010-09-09'
Description: EC2 module for deploying a single EC2 instance

Parameters:
  SubnetId:
    Type: String
    Description: ID of the subnet to launch the EC2 instance in
  SecurityGroupId:
    Type: String
    Description: ID of the security group for the EC2 instance
  KeyName:
    Type: AWS::EC2::KeyPair::KeyName
    Description: Name of an existing EC2 key pair for SSH access
  ImageId:
    Type: String
    Description: AMI ID for the EC2 instance (e.g., Amazon Linux 2)
  InstanceType:
    Type: String
    Description: EC2 instance type
    Default: t2.micro
    AllowedValues:
      - t2.micro
      - t3.micro
      - t3.nano
    ConstraintDescription: Must be a valid EC2 instance type
  InstanceName:
    Type: String
    Description: Name tag for the EC2 instance
    Default: EC2Instance

Resources:
  EC2:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref ImageId
      InstanceType: !Ref InstanceType
      SubnetId: !Ref SubnetId
      SecurityGroupIds: [!Ref SecurityGroupId]
      KeyName: !Ref KeyName
      Tags:
        - Key: Name
          Value: !Ref InstanceName

Outputs:
  InstanceId:
    Description: ID of the EC2 instance
    Value: !Ref EC2
  PublicIp:
    Description: Public IP of the EC2 instance (if in a public subnet)
    Value: !GetAtt EC2.PublicIp
    Condition: HasPublicIp
  PrivateIp:
    Description: Private IP of the EC2 instance
    Value: !GetAtt EC2.PrivateIp

Conditions:
  HasPublicIp: !Not [!Equals [!GetAtt EC2.PublicIp, ""]]