AWSTemplateFormatVersion: '2010-09-09'
Description: Main stack for Lab 1

Mappings:
  SubnetConfig:
    VPC:
      CIDR: 10.0.0.0/16
    Public:
      CIDR: 10.0.0.0/24
    Private:
      CIDR: 10.0.1.0/24

  RegionAMIMap:
    us-east-1:
      AMI: ami-0e449927258d45bc4
    ap-southeast-2:
      AMI: ami-0f6a1a6507c55c9a8

Parameters:
  AllowedIp:
    Type: String
    Description: IP address for SSH access (e.g., 203.0.113.10/32)
    AllowedPattern: ^([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])\.([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])\.([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])\.([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])/32$
    ConstraintDescription: Must be a valid IPv4 address with /32 CIDR
  KeyName:
    Type: AWS::EC2::KeyPair::KeyName
    Description: Name of an existing EC2 KeyPair

Resources:
  VPC:
    Type: MyAWS::VPC::MyVPC::MODULE
    Properties:
      CidrBlock: !FindInMap [SubnetConfig, VPC, CIDR]
      PublicBlock: !FindInMap [SubnetConfig, Public, CIDR]
      PrivateBlock: !FindInMap [SubnetConfig, Private, CIDR]
      KeyName: !Ref KeyName
      AllowedIp: !Ref AllowedIp
      ImageId: !FindInMap [RegionAMIMap, !Ref AWS::Region, AMI]

